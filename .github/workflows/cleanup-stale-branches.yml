# one-time cleanup trigger
name: Cleanup stale branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-stale-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged and superseded work branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "ci/ext4-image-integration"
            "feat/i18n-1.0.29"
            "feat/usbdk-bot-fallback"
            "fix/all-reader-raw-access"
            "fix/detect-windows-write-policy"
            "fix/direct-partition-device-fallback"
            "fix/enable-manage-volume-privilege"
            "fix/hidden-harddiskvolume-handle"
            "fix/hidden-volume-native-raw-access"
            "fix/jbd2-commit-checksum-header"
            "fix/locked-partition-device-write"
            "fix/native-nt-raw-write"
            "fix/offline-volume-before-raw-write"
            "fix/partition-dasd-alias-and-writability"
            "fix/partition-fallback-test-fixture"
            "fix/retry-physical-after-volume-lock"
            "fix/rufus-style-raw-disk-open"
            "fix/scsi-pass-through-direct"
            "fix/scsi-write-fallback"
            "fix/system-fresh-open"
            "fix/system-raw-helper"
            "fix/unbuffered-sd-raw-write"
            "fix/usbdk-failure-recovery-1.0.24"
            "fix/whole-disk-offline-raw-write"
            "fix/windows-jbd2-recovery"
            "fix/windows-raw-volume-write"
            "fix/write-safety-1.0.30"
            "fix-dir-journal"
            "fix-large-copy"
            "refactor/ext4lib-1.0.28"
            "refactor/flat-root-1.0.26"
            "verify/write-path-ci"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
