name: Build Windows EXE

on:
  push:
    branches:
      - main
    paths-ignore:
      - Ext4Reader.exe
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ext4reader-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run regression tests
        shell: pwsh
        run: |
          python -m unittest discover -v -s tests -p "test_*.py"
          python -c "import runpy; runpy.run_path('tests/test_extent_tree.py', run_name='__main__')"

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import ext4lib; print(ext4lib.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building EXT4 Reader $version"

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm Ext4Reader.spec
          if (!(Test-Path "dist\Ext4Reader.exe")) {
            throw "dist\Ext4Reader.exe was not created"
          }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\\Ext4Reader.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Ext4Reader.exe" | Set-Content -Encoding ascii "dist\\SHA256SUMS.txt"
          Get-Content "dist\\SHA256SUMS.txt"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ext4Reader-${{ steps.version.outputs.version }}-windows
          path: |
            dist/Ext4Reader.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Update repository EXE
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Copy-Item -Force "dist\Ext4Reader.exe" "Ext4Reader.exe"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ext4Reader.exe
          if (git diff --cached --quiet) {
            Write-Host "Ext4Reader.exe is already up to date"
            exit 0
          }
          git commit -m "Build Ext4Reader.exe v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Create GitHub Release if missing
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "$env:TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists"
            gh release upload "$env:TAG" "dist\Ext4Reader.exe#Ext4Reader.exe" --clobber
          } else {
            gh release create "$env:TAG" "dist\Ext4Reader.exe#Ext4Reader.exe" `
              --target "${{ github.sha }}" `
              --title "EXT4 Reader $env:VERSION" `
              --notes "Windows EXE 자동 빌드. main.py 단일 진입점 + ext4lib 라이브러리 구조, EXT4 JBD2 복구 및 UsbDk fallback 포함."
          }

  ext4-image-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install e2fsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs

      - name: Create EXT4 test images
        run: |
          truncate -s 256M clean.img
          mkfs.ext4 -F -q -b 4096 -O ^64bit,^metadata_csum,^orphan_file clean.img
          cp clean.img dirty.img

      - name: Exercise EXT4 writer
        run: |
          python -m tests.integration_ext4_image clean.img --mode clean
          python -m tests.integration_ext4_image dirty.img --mode dirty-marker

      - name: Validate clean image with e2fsck
        run: |
          sudo e2fsck -fn clean.img

      - name: Validate crash-marked image with e2fsck
        run: |
          set +e
          sudo e2fsck -fn dirty.img
          rc=$?
          set -e
          # e2fsck bit 4/8/16/32/128 indicates uncorrected/operational/usage/
          # cancelled/shared-library failure. A merely unclean filesystem may
          # still return 0 after a read-only full check.
          if (( rc & (4|8|16|32|128) )); then
            exit "$rc"
          fi

