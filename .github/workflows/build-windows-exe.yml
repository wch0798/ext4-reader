name: Build Windows EXE

on:
  push:
    branches:
      - main
    paths-ignore:
      - Ext4Reader.exe
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run regression tests
        shell: pwsh
        run: |
          python -m unittest discover -v -p "test_*.py"

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import ext4reader; print(ext4reader.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building EXT4 Reader $version"

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm Ext4Reader.spec
          if (!(Test-Path "dist\Ext4Reader.exe")) {
            throw "dist\Ext4Reader.exe was not created"
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ext4Reader-${{ steps.version.outputs.version }}-windows
          path: dist/Ext4Reader.exe
          if-no-files-found: error

      - name: Update repository EXE
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Copy-Item -Force "dist\Ext4Reader.exe" "Ext4Reader.exe"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ext4Reader.exe
          if (git diff --cached --quiet) {
            Write-Host "Ext4Reader.exe is already up to date"
            exit 0
          }
          git commit -m "Build Ext4Reader.exe v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Create GitHub Release if missing
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "$env:TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists"
            gh release upload "$env:TAG" "dist\Ext4Reader.exe#Ext4Reader.exe" --clobber
          } else {
            gh release create "$env:TAG" "dist\Ext4Reader.exe#Ext4Reader.exe" `
              --target "${{ github.sha }}" `
              --title "EXT4 Reader $env:VERSION" `
              --notes "Windows EXE 자동 빌드. EXT4 JBD2 저널 자동 복구 기능 포함."
          }