name: Build Windows EXE

on:
  push:
    branches:
      - main
    paths-ignore:
      - Ext4Reader.exe
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ext4reader-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run regression tests
        shell: pwsh
        run: |
          python -m unittest discover -v -s tests -p "test_*.py"
          python -c "import runpy; runpy.run_path('tests/test_extent_tree.py', run_name='__main__')"

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import ext4lib; print(ext4lib.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building EXT4 Reader $version"

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm Ext4Reader.spec
          if (!(Test-Path "dist\Ext4Reader.exe")) {
            throw "dist\Ext4Reader.exe was not created"
          }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\\Ext4Reader.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Ext4Reader.exe" | Set-Content -Encoding ascii "dist\\SHA256SUMS.txt"
          Get-Content "dist\\SHA256SUMS.txt"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ext4Reader-${{ steps.version.outputs.version }}-windows
          path: |
            dist/Ext4Reader.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Update repository EXE
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Copy-Item -Force "dist\Ext4Reader.exe" "Ext4Reader.exe"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ext4Reader.exe
          if (git diff --cached --quiet) {
            Write-Host "Ext4Reader.exe is already up to date"
            exit 0
          }
          git commit -m "Build Ext4Reader.exe v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Create GitHub Release if missing
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "$env:TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists"
            gh release upload "$env:TAG" "dist\Ext4Reader.exe#Ext4Reader.exe" --clobber
          } else {
            gh release create "$env:TAG" "dist\Ext4Reader.exe#Ext4Reader.exe" `
              --target "${{ github.sha }}" `
              --title "EXT4 Reader $env:VERSION" `
              --notes "Windows EXE 자동 빌드. main.py 단일 진입점 + ext4lib 라이브러리 구조, EXT4 JBD2 복구 및 UsbDk fallback 포함."
          }

  ext4-image-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install e2fsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs gdisk

      - name: Create EXT4 test images
        run: |
          truncate -s 256M clean.img
          mkfs.ext4 -F -q -b 4096 -O ^64bit,^metadata_csum,^orphan_file clean.img
          cp clean.img dirty.img

          truncate -s 256M journal.img
          mkfs.ext4 -F -q -b 4096 -O 64bit,metadata_csum,^orphan_file,^fast_commit journal.img

          truncate -s 256M repair.img
          mkfs.ext4 -F -q -b 4096 -O 64bit,metadata_csum,^orphan_file,^fast_commit repair.img

          truncate -s 256M legacy-bitmap.img
          mkfs.ext4 -F -q -b 4096 -O 64bit,metadata_csum,^orphan_file,^fast_commit legacy-bitmap.img

          truncate -s 256M bitmap-high.img
          mkfs.ext4 -F -q -b 4096 -O 64bit,metadata_csum,^orphan_file,^fast_commit bitmap-high.img

          # Modern ext4 layout used by Steam Deck-class Linux systems.
          truncate -s 256M orphan.img
          mkfs.ext4 -F -q -b 4096 -O 64bit,metadata_csum,orphan_file,^fast_commit orphan.img

          # Build a real indexed (HTREE) directory using Linux/e2fsprogs.
          mkdir -p htree-src/indexed
          for i in $(seq 1 1800); do
            : > "htree-src/indexed/file-$i.txt"
          done
          truncate -s 256M htree.img
          mkfs.ext4 -F -q -b 4096 -O 64bit,metadata_csum,^orphan_file,^fast_commit -d htree-src htree.img
          set +e
          sudo e2fsck -fyD htree.img
          htree_rc=$?
          set -e
          if (( htree_rc & (4|8|16|32|128) )); then
            exit "$htree_rc"
          fi

          # Real disk layout: GPT + one Linux filesystem partition containing EXT4.
          truncate -s 320M gpt.img
          sgdisk -og gpt.img
          sgdisk -n 1:2048:526335 -t 1:8300 -c 1:EXT4TEST gpt.img
          truncate -s 256M gpt-part-seed.img
          mkfs.ext4 -F -q -b 4096 -O 64bit,metadata_csum,^orphan_file,^fast_commit gpt-part-seed.img
          dd if=gpt-part-seed.img of=gpt.img bs=512 seek=2048 conv=notrunc status=none

      - name: Exercise EXT4 writer
        run: |
          python -m tests.integration_ext4_image clean.img --mode clean
          python -m tests.integration_ext4_image dirty.img --mode dirty-marker
          python -m tests.integration_ext4_image journal.img --mode journal-replay
          python -m tests.integration_ext4_image repair.img --mode error-repair
          python -m tests.integration_ext4_image legacy-bitmap.img --mode legacy-bitmap-repair
          python -m tests.integration_ext4_image bitmap-high.img --mode bitmap-high-repair
          python -m tests.integration_ext4_image orphan.img --mode orphan-repair
          python -m tests.integration_ext4_image htree.img --mode htree
          python -m tests.integration_ext4_image gpt.img --mode gpt-portable

      - name: Validate clean images with e2fsck
        run: |
          sudo e2fsck -fn clean.img
          sudo e2fsck -fn journal.img
          sudo e2fsck -fn repair.img
          debugfs -R "stat /windows-repaired.bin" repair.img

          # Recovered media that exactly reproduced the old Ext4Reader
          # bitmap-checksum placement bug must be clean to Linux/e2fsck.
          sudo e2fsck -fn legacy-bitmap.img
          sudo e2fsck -fn bitmap-high.img

          sudo e2fsck -fn orphan.img
          debugfs -R "stat /orphan-keep.bin" orphan.img

          # Linux must resolve the Windows-created name through the real HTREE,
          # not merely by our own directory walker.
          sudo e2fsck -fn htree.img
          debugfs -R "stat /indexed/from-windows.bin" htree.img

          # Validate that the GPT itself is still valid and that the EXT4
          # partition is independently readable after being moved/extracted.
          sgdisk -v gpt.img
          dd if=gpt.img of=gpt-part-after.img bs=512 skip=2048 count=524288 status=none
          sudo e2fsck -fn gpt-part-after.img
          dumpe2fs -h gpt-part-after.img >/dev/null
          debugfs -R "stat /portable.bin" gpt-part-after.img

      - name: Validate crash-marked image with e2fsck
        run: |
          set +e
          sudo e2fsck -fn dirty.img
          rc=$?
          set -e
          # e2fsck bit 4/8/16/32/128 indicates uncorrected/operational/usage/
          # cancelled/shared-library failure. A merely unclean filesystem may
          # still return 0 after a read-only full check.
          if (( rc & (4|8|16|32|128) )); then
            exit "$rc"
          fi

